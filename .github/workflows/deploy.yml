# Student capstone deploy — copy to .github/workflows/deploy.yml in your repo.
#
# Every push to main: builds your Docker image IN Azure Container Registry
# (no Docker needed in the runner, no registry password anywhere), then points
# your Container App at the new image.
#
# Setup (once, done for you at onboarding): five repo VARIABLES (not secrets —
# none of these values are secret):
#   AZURE_CLIENT_ID        — your CI identity (id-gh-<you>)
#   AZURE_TENANT_ID        — d75a3b31-b6ea-4bc1-9a3c-f760e543f24e
#   AZURE_SUBSCRIPTION_ID  — da17b3c4-4654-42b9-8719-5be9df6afa9f
#   ACR_NAME               — the shared registry name
#   STUDENT                — your roster name (also your app + hostname)
#
# The platform provisions DATABASE_URL on the Container App automatically —
# it does NOT know your ANTHROPIC_API_KEY, since that's yours alone. Without
# it, every agent's `new Anthropic()` client throws at startup (all agents
# fail identically, not a partial failure), so it has to be pushed on every
# deploy from a real GitHub Secret (unlike the five variables above, this
# value genuinely is sensitive). Same story for MCP_BEARER_TOKEN (a random
# shared secret gating the /api/[transport] MCP endpoint, which otherwise
# lets anyone with the URL read every assessment ever run) — without it set,
# that endpoint rejects every request rather than failing open. Same story
# again for EPO_OPS_CLIENT_ID/EPO_OPS_CLIENT_SECRET (Patent Agent's OAuth2
# client-credentials pair) — without them the Patent Agent fails every run,
# not a partial failure either.
#
# Google OAuth (whole-app gate, see proxy.ts): GOOGLE_CLIENT_ID/
# GOOGLE_CLIENT_SECRET (from Google Cloud Console), NEXTAUTH_SECRET (a
# random value signing session JWTs — without it every session is
# rejected), and ALLOWED_EMAILS (the actual access-control list; a valid
# Google login alone isn't enough, the email must be on this list too) are
# all genuinely sensitive secrets. NEXTAUTH_URL is not sensitive (it's just
# this app's own public URL, needed so next-auth builds correct OAuth
# callback/redirect URLs) — a plain repo Variable, not a secret.
name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write   # OIDC token for azure/login — this is the whole auth story
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image (in ACR)
        run: |
          az acr build --registry ${{ vars.ACR_NAME }} \
            --image ${{ vars.STUDENT }}/web:${{ github.sha }} .

      - name: Register Container App secret
        run: |
          az containerapp secret set \
            --resource-group rg-students-platform \
            --name ca-${{ vars.STUDENT }} \
            --secrets \
              anthropic-api-key="${{ secrets.ANTHROPIC_API_KEY }}" \
              mcp-bearer-token="${{ secrets.MCP_BEARER_TOKEN }}" \
              epo-ops-client-id="${{ secrets.EPO_OPS_CLIENT_ID }}" \
              epo-ops-client-secret="${{ secrets.EPO_OPS_CLIENT_SECRET }}" \
              google-client-id="${{ secrets.GOOGLE_CLIENT_ID }}" \
              google-client-secret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              nextauth-secret="${{ secrets.NEXTAUTH_SECRET }}" \
              allowed-emails="${{ secrets.ALLOWED_EMAILS }}"

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --resource-group rg-students-platform \
            --name ca-${{ vars.STUDENT }} \
            --image ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.STUDENT }}/web:${{ github.sha }} \
            --set-env-vars \
              ANTHROPIC_API_KEY=secretref:anthropic-api-key \
              MCP_BEARER_TOKEN=secretref:mcp-bearer-token \
              EPO_OPS_CLIENT_ID=secretref:epo-ops-client-id \
              EPO_OPS_CLIENT_SECRET=secretref:epo-ops-client-secret \
              GOOGLE_CLIENT_ID=secretref:google-client-id \
              GOOGLE_CLIENT_SECRET=secretref:google-client-secret \
              NEXTAUTH_SECRET=secretref:nextauth-secret \
              ALLOWED_EMAILS=secretref:allowed-emails \
              NEXTAUTH_URL="${{ vars.NEXTAUTH_URL }}"
